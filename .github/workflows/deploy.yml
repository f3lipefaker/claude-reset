name: Publicar

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Criar pasta no servidor
        run: |
          sshpass -p '@Felipe$1236' ssh -o StrictHostKeyChecking=accept-new -p 33488 fbdomingos@170.150.189.14 "mkdir -p /home/fbdomingos/developer/claude-reset/dist"

      - name: Enviar arquivos
        run: |
          sshpass -p '@Felipe$1236' scp -o StrictHostKeyChecking=accept-new -P 33488 index.html sw.js fbdomingos@170.150.189.14:/home/fbdomingos/developer/claude-reset/dist/