<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EC">
<title>Claude Reset Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reset Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC; --panel:#FBFAF6; --panel2:#EFECE2; --line:#E3DFD2;
  --text:#1F1E1B; --muted:#6F6B60;
  --accent:#C6613F; --accent-h:#B5532F; --accent-soft:rgba(198,97,63,.10);
  --ok:#4C8A5A; --ok-soft:rgba(76,138,90,.12); --idle:#A39D8C; --red:#B3402F;
  --shadow:0 1px 2px rgba(60,50,30,.05),0 8px 24px -12px rgba(60,50,30,.16);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"DM Sans","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1F1E1D; --panel:#2A2927; --panel2:#33312E; --line:#3D3A36;
  --text:#F0EEE6; --muted:#A39E90;
  --accent:#D97757; --accent-h:#E58868; --accent-soft:rgba(217,119,87,.14);
  --ok:#86BF93; --ok-soft:rgba(134,191,147,.14); --idle:#7C776B; --red:#E8806F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1F1E1D; --panel:#2A2927; --panel2:#33312E; --line:#3D3A36;
    --text:#F0EEE6; --muted:#A39E90;
    --accent:#D97757; --accent-h:#E58868; --accent-soft:rgba(217,119,87,.14);
    --ok:#86BF93; --ok-soft:rgba(134,191,147,.14); --idle:#7C776B; --red:#E8806F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;margin:0}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{font-family:var(--sans);color:var(--text);background:var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 70px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;color:var(--accent);flex:none}
.logo svg{width:100%;height:100%}
h1{font:500 1.9rem/1.1 var(--serif);letter-spacing:-.015em}
.sub{font-size:.9rem;color:var(--muted);margin-top:4px}
.hright{display:flex;align-items:center;gap:14px}
.clock{font:500 1.5rem var(--serif);font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.clock small{display:block;font:400 .78rem var(--sans);color:var(--muted);margin-top:3px;text-transform:capitalize}
.icon{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.stat span{font-size:.82rem;color:var(--muted)}
.stat b{display:block;font:500 2.2rem/1.15 var(--serif);font-variant-numeric:tabular-nums;margin-top:2px}
.stat.ready b{color:var(--ok)} .stat.wait b{color:var(--accent)} .stat.next b{font-size:1.75rem;line-height:1.45}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 15px;font-weight:500;font-size:.88rem;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2);border-color:var(--idle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger:hover{color:var(--red);border-color:var(--red);background:transparent}
.chip{font-size:.85rem;display:inline-flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.chip.on .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.spacer{flex:1}
.dur{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dur input{width:62px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;box-shadow:var(--shadow);transition:border-color .3s}
.card.ready{border-color:var(--ok);background:linear-gradient(var(--ok-soft),var(--ok-soft)),var(--panel)}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:var(--line);stroke-width:6}
.ring .ticks{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:1 8.3}
.ring .p{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset 1s linear,stroke .3s}
.card.ready .p{stroke:var(--ok)} .card.idle .p{stroke:var(--idle)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:500 1.25rem var(--serif);font-variant-numeric:tabular-nums}
.info{min-width:0}
.email{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.time{font:500 2rem/1.05 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card.ready .time{color:var(--ok)} .card.counting .time{color:var(--accent)}
.when{font-size:.8rem;color:var(--muted);margin-top:5px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.acts .btn{padding:7px 11px;font-size:.8rem;border-radius:10px}

.empty{grid-column:1/-1;text-align:center;padding:56px 20px;border:1px dashed var(--idle);border-radius:22px;color:var(--muted)}
.empty b{display:block;color:var(--text);font:500 1.4rem var(--serif);margin-bottom:8px}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);padding:0;width:min(430px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(31,30,27,.45);backdrop-filter:blur(3px)}
dialog form{padding:24px;display:grid;gap:16px}
dialog h2{font:500 1.5rem var(--serif)}
label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
label input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--text);font-size:1rem}
label input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;justify-content:flex-end}
.hint{font-size:.8rem;color:var(--muted)}

#toasts{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;gap:8px;justify-items:center;pointer-events:none;z-index:50}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 18px;font-size:.9rem;box-shadow:var(--shadow);max-width:440px}
.toast.err{background:var(--red);color:#fff}

@media (max-width:520px){
  .wrap{padding:20px 14px 70px}
  h1{font-size:1.5rem}
  .logo{width:36px;height:36px}
  .clock{font-size:1.2rem}
  .card{grid-template-columns:88px 1fr;padding:16px;gap:14px}
  .ring{width:88px;height:88px}
  .time{font-size:1.65rem}
  .stat{padding:13px 14px}.stat b{font-size:1.7rem}.stat.next b{font-size:1.2rem;line-height:2}
  .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){.ring .p,.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M24 24 L24 4" transform="rotate(0 24 24)"/><path d="M24 24 L24 4" transform="rotate(30 24 24)"/><path d="M24 24 L24 4" transform="rotate(60 24 24)"/><path d="M24 24 L24 4" transform="rotate(90 24 24)"/><path d="M24 24 L24 4" transform="rotate(120 24 24)"/><path d="M24 24 L24 4" transform="rotate(150 24 24)"/><path d="M24 24 L24 4" transform="rotate(180 24 24)"/><path d="M24 24 L24 4" transform="rotate(210 24 24)"/><path d="M24 24 L24 4" transform="rotate(240 24 24)"/><path d="M24 24 L24 4" transform="rotate(270 24 24)"/><path d="M24 24 L24 4" transform="rotate(300 24 24)"/><path d="M24 24 L24 4" transform="rotate(330 24 24)"/></svg></div>
      <div>
        <h1>Claude Reset Radar</h1>
        <div class="sub" id="greet">Janela de uso das contas gratuitas</div>
      </div>
    </div>
    <div class="hright"><button class="btn icon" id="themeBtn" aria-label="Alternar tema"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><div class="clock" id="clock">--:--:--<small id="date"></small></div></div>
  </header>

  <section class="stats" aria-label="Resumo">
    <div class="stat ready"><span>Prontas</span><b id="sReady">0</b></div>
    <div class="stat wait"><span>Em contagem</span><b id="sWait">0</b></div>
    <div class="stat next"><span>Próxima libera em</span><b id="sNext">—</b></div>
  </section>

  <div class="bar">
    <button class="btn primary" id="addBtn">+ Adicionar conta</button>
    <button class="btn" id="notifBtn"><span class="chip" id="notifChip" style="border:0;padding:0"><i class="dot"></i><span id="notifTxt">Ativar avisos</span></span></button>
    <button class="btn" id="wakeBtn">Manter tela ligada</button>
    <span class="spacer"></span>
    <label class="dur" style="display:flex;grid-template-columns:none">Janela (h)
      <input type="number" id="durInp" min="1" max="24" step="0.5" inputmode="decimal">
    </label>
    <button class="btn" id="expBtn">Exportar</button>
    <button class="btn" id="impBtn">Importar</button>
    <input type="file" id="impFile" accept="application/json" hidden>
  </div>

  <main class="grid" id="grid"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Adicionar conta</h2>
    <label>E-mail ou apelido
      <input id="fEmail" type="text" required autocomplete="off" placeholder="conta1@gmail.com">
    </label>
    <label>Última mensagem enviada há (minutos)
      <input id="fAgo" type="number" min="0" step="1" inputmode="numeric" placeholder="vazio = conta livre">
    </label>
    <p class="hint">Se a conta já está em contagem, informe há quantos minutos você começou a usar. Deixe vazio para uma conta livre.</p>
    <div class="row">
      <button type="button" class="btn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script>
(() => {
  const KEY = "claude-reset-radar:v1";
  const C = 276.46; // circunferência do anel (r=44)
  const $ = s => document.querySelector(s);
  let state = load();
  let editingId = null;
  let audioCtx = null, wakeLock = null;

  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.accounts)) return {hours: s.hours || 5, accounts: s.accounts};
    }catch(e){}
    return {hours:5, accounts:[]};
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("Não foi possível salvar neste navegador.", true); } }
  const uid = () => Math.random().toString(36).slice(2,9);
  const dur = () => state.hours * 3600000;
  const endOf = a => a.startedAt + dur();
  const fmt = ms => {
    ms = Math.max(0, Math.ceil(ms/1000));
    const h = Math.floor(ms/3600), m = Math.floor(ms%3600/60), s = ms%60;
    return [h,m,s].map(n => String(n).padStart(2,"0")).join(":");
  };
  const hhmm = t => new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const statusOf = (a, now) => !a.startedAt ? "idle" : (now >= endOf(a) ? "ready" : "counting");

  /* ---------- render ---------- */
  function render(){
    const g = $("#grid");
    if(!state.accounts.length){
      g.innerHTML = '<div class="empty"><b>Nenhuma conta ainda</b>Adicione o e-mail de uma conta gratuita e toque em “Usei agora” quando enviar sua primeira mensagem.</div>';
      tick(); return;
    }
    const now = Date.now();
    const order = {ready:0, idle:1, counting:2};
    const list = [...state.accounts].sort((a,b) => {
      const sa = statusOf(a,now), sb = statusOf(b,now);
      if(sa!==sb) return order[sa]-order[sb];
      return (a.startedAt||0) - (b.startedAt||0);
    });
    g.innerHTML = list.map(a => `
      <article class="card" data-id="${a.id}">
        <div class="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ticks" cx="50" cy="50" r="47.5"/>
            <circle class="t" cx="50" cy="50" r="44"/>
            <circle class="p" cx="50" cy="50" r="44"/>
          </svg>
          <div class="pct"></div>
        </div>
        <div class="info">
          <div class="email" title="${esc(a.email)}">${esc(a.email)}</div>
          <div class="state"></div>
          <div class="time"></div>
          <div class="when"></div>
          <div class="acts">
            <button class="btn primary" data-act="use">Usei agora</button>
            <button class="btn" data-act="free">Liberar</button>
            <button class="btn" data-act="edit">Ajustar</button>
            <button class="btn danger" data-act="del">Remover</button>
          </div>
        </div>
      </article>`).join("");
    tick();
  }

  /* ---------- tick (1s) ---------- */
  function tick(){
    const now = Date.now();
    $("#clock").firstChild.nodeValue = new Date(now).toLocaleTimeString("pt-BR");
    $("#date").textContent = new Date(now).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
    let ready=0, wait=0, next=Infinity, fired=false;

    state.accounts.forEach(a => {
      const st = statusOf(a, now);
      if(st==="ready"){ ready++; if(!a.notified){ a.notified = true; fired = true; notify(a); } }
      if(st==="counting"){ wait++; next = Math.min(next, endOf(a)-now); }
      if(st==="idle") ready++;
      const el = document.querySelector(`.card[data-id="${a.id}"]`);
      if(!el) return;
      el.className = "card " + st;
      const left = st==="counting" ? endOf(a)-now : 0;
      const prog = st==="counting" ? (now-a.startedAt)/dur() : 1;
      el.querySelector(".p").style.strokeDashoffset = C*(1-Math.min(1,prog));
      el.querySelector(".pct").textContent = st==="counting" ? Math.floor(prog*100)+"%" : "OK";
      el.querySelector(".state").textContent = st==="ready" ? "Pronta para uso" : st==="idle" ? "Livre, sem contagem" : "Aguardando reset";
      el.querySelector(".time").textContent = st==="counting" ? fmt(left) : "Pronta";
      el.querySelector(".when").textContent = st==="counting" ? "Libera às "+hhmm(endOf(a)) : st==="ready" ? "Liberada às "+hhmm(endOf(a)) : "Toque em “Usei agora” ao começar";
    });
    if(fired) save();
    $("#sReady").textContent = ready;
    $("#sWait").textContent = wait;
    $("#sNext").textContent = next===Infinity ? "—" : fmt(next);
    document.title = (ready ? `(${ready}) ` : "") + "Claude Reset Radar";
  }

  /* ---------- avisos ---------- */
  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      [660,880,1100].forEach((f,i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = f; o.type = "sine";
        g.gain.setValueAtTime(.0001, audioCtx.currentTime + i*.18);
        g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + i*.18 + .02);
        g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + i*.18 + .16);
        o.connect(g).connect(audioCtx.destination);
        o.start(audioCtx.currentTime + i*.18); o.stop(audioCtx.currentTime + i*.18 + .17);
      });
    }catch(e){}
  }
  async function notify(a){
    toast(`${a.email} está pronta para uso`);
    beep();
    if(navigator.vibrate) navigator.vibrate([250,100,250,100,400]);
    if("Notification" in window && Notification.permission==="granted"){
      const opts = {body:`${a.email} já pode receber novas mensagens.`, tag:"reset-"+a.id, renotify:true, icon:"icon-192.png", badge:"icon-192.png", requireInteraction:true};
      try{
        const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
        if(reg) reg.showNotification("Conta pronta", opts); else new Notification("Conta pronta", opts);
      }catch(e){ try{ new Notification("Conta pronta", opts); }catch(_){} }
    }
  }
  function updateNotifUI(){
    const ok = "Notification" in window && Notification.permission==="granted";
    $("#notifChip").classList.toggle("on", ok);
    $("#notifTxt").textContent = !("Notification" in window) ? "Avisos indisponíveis" : ok ? "Avisos ativos" : Notification.permission==="denied" ? "Avisos bloqueados" : "Ativar avisos";
  }
  $("#notifBtn").onclick = async () => {
    if(!("Notification" in window)) return toast("Este navegador não suporta notificações. Use HTTPS.", true);
    if(Notification.permission==="denied") return toast("Libere as notificações nas configurações do site.", true);
    await Notification.requestPermission();
    updateNotifUI(); beep();
    if(Notification.permission==="granted") toast("Avisos ativados");
  };
  $("#wakeBtn").onclick = async () => {
    try{
      if(wakeLock){ await wakeLock.release(); wakeLock=null; $("#wakeBtn").textContent="Manter tela ligada"; return; }
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock=null; $("#wakeBtn").textContent="Manter tela ligada"; });
      $("#wakeBtn").textContent = "Tela ligada: ativo";
    }catch(e){ toast("Seu navegador não permite manter a tela ligada.", true); }
  };
  document.addEventListener("visibilitychange", async () => {
    if(!document.hidden){ tick(); if($("#wakeBtn").textContent.includes("ativo") && !wakeLock){ try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} } }
  });

  function toast(msg, err){
    const t = document.createElement("div");
    t.className = "toast" + (err?" err":""); t.textContent = msg;
    $("#toasts").appendChild(t);
    setTimeout(() => t.remove(), 4500);
  }

  /* ---------- ações ---------- */
  const dlg = $("#dlg");
  function openDlg(a){
    editingId = a ? a.id : null;
    $("#dlgTitle").textContent = a ? "Ajustar conta" : "Adicionar conta";
    $("#fEmail").value = a ? a.email : "";
    $("#fAgo").value = a && a.startedAt ? Math.max(0, Math.round((Date.now()-a.startedAt)/60000)) : "";
    dlg.showModal(); $("#fEmail").focus();
  }
  $("#addBtn").onclick = () => openDlg(null);
  $("#cancelBtn").onclick = () => dlg.close();
  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const email = $("#fEmail").value.trim(); if(!email) return;
    const agoRaw = $("#fAgo").value.trim();
    const startedAt = agoRaw==="" ? null : Date.now() - Number(agoRaw)*60000;
    if(editingId){
      const a = state.accounts.find(x => x.id===editingId);
      a.email = email; a.startedAt = startedAt; a.notified = !!startedAt && Date.now() >= startedAt+dur();
    } else {
      state.accounts.push({id:uid(), email, startedAt, notified: !!startedAt && Date.now() >= startedAt+dur()});
    }
    save(); dlg.close(); render();
  });

  $("#grid").addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const id = b.closest(".card").dataset.id;
    const a = state.accounts.find(x => x.id===id);
    const act = b.dataset.act;
    if(act==="use"){ a.startedAt = Date.now(); a.notified = false; audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); toast(`Contagem iniciada: libera às ${hhmm(endOf(a))}`); }
    if(act==="free"){ a.startedAt = null; a.notified = false; }
    if(act==="edit") return openDlg(a);
    if(act==="del"){ if(!confirm(`Remover ${a.email}?`)) return; state.accounts = state.accounts.filter(x => x.id!==id); }
    save(); render();
  });

  $("#durInp").value = state.hours;
  $("#durInp").onchange = e => {
    const v = parseFloat(e.target.value);
    if(!(v>=1 && v<=24)){ e.target.value = state.hours; return; }
    state.hours = v;
    state.accounts.forEach(a => a.notified = !!a.startedAt && Date.now() >= endOf(a));
    save(); render();
  };

  $("#expBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "claude-reset-radar.json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("#impBtn").onclick = () => $("#impFile").click();
  $("#impFile").onchange = async e => {
    try{
      const s = JSON.parse(await e.target.files[0].text());
      if(!Array.isArray(s.accounts)) throw 0;
      state = {hours: s.hours||5, accounts: s.accounts.map(a => ({id:a.id||uid(), email:String(a.email||"conta"), startedAt:a.startedAt||null, notified:!!a.notified}))};
      $("#durInp").value = state.hours; save(); render(); toast("Backup importado");
    }catch(_){ toast("Arquivo inválido.", true); }
    e.target.value = "";
  };

  /* ---------- tema e saudação ---------- */
  const root = document.documentElement;
  try{ const t = localStorage.getItem(KEY+":theme"); if(t) root.dataset.theme = t; }catch(e){}
  const isDark = () => root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const syncMeta = () => document.querySelector('meta[name="theme-color"]').content = isDark() ? "#1F1E1D" : "#F5F3EC";
  $("#themeBtn").onclick = () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try{ localStorage.setItem(KEY+":theme", root.dataset.theme); }catch(e){}
    syncMeta();
  };
  syncMeta();
  const h = new Date().getHours();
  $("#greet").textContent = (h<5 ? "Boa madrugada" : h<12 ? "Bom dia" : h<18 ? "Boa tarde" : "Boa noite") + ". Veja quais contas já podem voltar a conversar.";

  /* ---------- início ---------- */
  if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  updateNotifUI(); render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
